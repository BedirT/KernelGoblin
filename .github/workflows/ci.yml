name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  trellis2-z-order-metal-build:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: brew install ninja
      - name: Validate harness
        run: ./kg validate
      # GitHub-hosted macOS VMs do not constitute physical-GPU verification.
      # Real Metal conformance remains an explicit local/self-hosted `kg test`.
      - name: Compile Metal kernel and host harness
        run: ./kg setup trellis2/z_order
