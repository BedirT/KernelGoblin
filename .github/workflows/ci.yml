name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  trellis2-native-build:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: brew install ninja
      - name: Validate harness
        run: ./kg validate
      - name: Audit no-Torch native TRELLIS runtime
        run: ./kg model native-audit trellis2
      # GitHub-hosted macOS VMs do not constitute physical-GPU verification.
      # Real Metal conformance remains an explicit local/self-hosted `kg test`.
      - name: Compile every registered kernel and host harness
        run: |
          for kernel in $(./kg list --ids); do
            ./kg setup "$kernel"
          done
